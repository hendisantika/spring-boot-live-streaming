spring.application.name=spring-boot-live-streaming
server.port=8080
spring.mvc.problemdetails.enabled=true

# LiveKit (isi lewat environment variable, jangan commit secret asli)
livekit.url=${LIVEKIT_URL:ws://localhost:7880}
livekit.api-url=${LIVEKIT_API_URL:http://localhost:7880}
livekit.api-key=${LIVEKIT_API_KEY:devkey}
livekit.api-secret=${LIVEKIT_API_SECRET:secret}
livekit.host-access-key=${LIVEKIT_HOST_ACCESS_KEY:}
livekit.token-ttl=6h
livekit.allowed-origins=${LIVEKIT_ALLOWED_ORIGINS:http://localhost:3000}
