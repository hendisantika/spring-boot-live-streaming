name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Setiap hari 05.00 Asia/Jakarta (WIB = UTC+7) -> 22.00 UTC hari sebelumnya
    - cron: "0 22 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR boleh dibatalkan run lamanya; push ke main antre agar deploy tidak terpotong
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: hendisantika/live-streaming-service

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build & test
        run: mvn -B -ntp verify

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # Next.js tetap dijalankan dengan Node; bun dipakai sebagai package manager & script runner
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

  docker:
    name: Docker image (Docker Hub)
    needs: backend
    # Hanya push ke main atau dijalankan manual; PR & jadwal harian tidak push image
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.run_number }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy backend to server
    needs: docker
    # Aktif setelah repository variable SSH_HOST diisi
    if: vars.SSH_HOST != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      # Port SSH server ramai bot, sehingga sshd (MaxStartups) kadang memutus koneksi baru
      # secara acak. Karena itu: satu koneksi per percobaan, dengan retry untuk error koneksi.
      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          IMAGE_TAG: ${{ github.run_number }}
          # Server mengambil file compose dari commit yang sama (repo public)
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/deploy
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          for attempt in $(seq 1 10); do
            set +e
            ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
              -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=20 -o ServerAliveInterval=15 \
              "$SSH_USER@$SSH_HOST" \
              "IMAGE_TAG='$IMAGE_TAG' RAW_BASE='$RAW_BASE' bash -s" < deploy/remote-deploy.sh
            code=$?
            set -e
            [ "$code" -eq 0 ] && exit 0
            # 255 = gagal koneksi SSH -> coba lagi; kode lain = script deploy gagal -> berhenti
            [ "$code" -ne 255 ] && exit "$code"
            echo "Koneksi SSH gagal (percobaan $attempt/10), coba lagi..."
            sleep $((attempt * 5))
          done
          echo "Tidak bisa terhubung ke server setelah 10 percobaan"
          exit 1
