name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Setiap hari 05.00 Asia/Jakarta (WIB = UTC+7) -> 22.00 UTC hari sebelumnya
    - cron: "0 22 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR boleh dibatalkan run lamanya; push ke main antre agar deploy tidak terpotong
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: hendisantika/live-streaming-service

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build & test
        run: mvn -B -ntp verify

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker image (Docker Hub)
    needs: backend
    # Hanya push ke main atau dijalankan manual; PR & jadwal harian tidak push image
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.run_number }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy backend to server
    needs: docker
    # Aktif setelah repository variable SSH_HOST diisi
    if: vars.SSH_HOST != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Copy compose files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          port: ${{ vars.SSH_PORT }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/compose.yaml,deploy/livekit.yaml"
          target: "~/live-streaming"
          strip_components: 1

      - name: Pull & restart containers
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.run_number }}
        with:
          host: ${{ vars.SSH_HOST }}
          port: ${{ vars.SSH_PORT }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG
          script: |
            set -e
            cd ~/live-streaming
            test -f .env || { echo "~/live-streaming/.env belum ada (lihat deploy/.env.example)"; exit 1; }
            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env
            else
              echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
            fi
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8020/api/rooms/healthcheck/token \
                -H 'Content-Type: application/json' -d '{"identity":"deploy-check"}' || true)
              [ "$code" = "200" ] && echo "API sehat (tag ${IMAGE_TAG})" && exit 0
              sleep 2
            done
            echo "API tidak merespons 200 setelah deploy"; docker compose logs --tail 80 api; exit 1
