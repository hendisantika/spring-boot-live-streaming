version: 2

updates:
  # Backend Spring Boot (pom.xml di root)
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      maven-minor-patch:
        update-types: [ "minor", "patch" ]

  # Frontend Next.js
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: [ "minor", "patch" ]

  # GitHub Actions di .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    commit-message:
      prefix: "chore(ci)"
