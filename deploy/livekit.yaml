# Konfigurasi LiveKit Server. API key/secret diberikan lewat env LIVEKIT_KEYS (compose.yaml).
port: 7880
rtc:
  tcp_port: 7881
  # Semua media UDP lewat satu port (mudah untuk firewall & Docker bridge)
  udp_port: 7882
  use_external_ip: false
room:
  empty_timeout: 300
  max_participants: 150
logging:
  level: info
