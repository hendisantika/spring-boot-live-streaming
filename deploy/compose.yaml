# Dijalankan di server dari ~/live-streaming (file ini disalin otomatis oleh workflow Docker).
#   docker compose up -d
# Nilai rahasia dan IMAGE_TAG ada di ~/live-streaming/.env (lihat .env.example).
name: live-streaming

services:
  api:
    image: hendisantika/live-streaming-service:${IMAGE_TAG:-latest}
    container_name: live-streaming-service
    restart: unless-stopped
    env_file: .env
    environment:
      # Backend memanggil server API LiveKit lewat network compose
      LIVEKIT_API_URL: http://livekit:7880
    ports:
      # Hanya untuk nginx di host (streaming.jvm.my.id/api)
      - "127.0.0.1:8020:8080"
    depends_on:
      - livekit

  livekit:
    image: livekit/livekit-server:v1.13.11
    container_name: live-streaming-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml --node-ip ${LIVEKIT_NODE_IP}
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # Signaling: hanya lewat nginx (streaming.jvm.my.id/rtc)
      - "127.0.0.1:7880:7880"
      # Media WebRTC: harus terbuka ke publik
      - "7881:7881/tcp"
      - "7882:7882/udp"
