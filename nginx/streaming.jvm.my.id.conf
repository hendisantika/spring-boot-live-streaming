# =============================================================================
# streaming.jvm.my.id
#   /api/*  -> Spring Boot (container live-streaming-service)  127.0.0.1:8020
#   /rtc*   -> LiveKit signaling (WebSocket + /rtc/validate)    127.0.0.1:7880
#
# TLS diterminasi di Cloudflare, sama seperti site lain di server ini: blok ini
# listen di :80 dan meneruskan X-Forwarded-Proto https. Cloudflare meneruskan
# WebSocket, jadi signaling LiveKit tetap jalan lewat proxy.
#
# Media WebRTC TIDAK lewat nginx maupun Cloudflare: client langsung ke
# 165.22.246.205 lewat 7881/tcp dan 7882/udp (harus dibuka di firewall).
#
# Pasang:
#   sudo cp nginx/streaming.jvm.my.id.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/streaming.jvm.my.id.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

map $http_upgrade $live_streaming_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;

    server_name streaming.jvm.my.id;

    access_log /var/log/nginx/streaming.jvm.my.id.access.log;
    error_log  /var/log/nginx/streaming.jvm.my.id.error.log;

    # Body API hanya JSON kecil (request token)
    client_max_body_size 64k;

    # --- Spring Boot API ---------------------------------------------------
    # CORS ditangani Spring Boot (LIVEKIT_ALLOWED_ORIGINS), jangan ditambah di sini.
    location /api/ {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # --- LiveKit signaling -------------------------------------------------
    # Client LiveKit memanggil wss://streaming.jvm.my.id/rtc dan /rtc/validate
    location /rtc {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $live_streaming_connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Koneksi signaling hidup selama kelas berlangsung
        proxy_read_timeout 3h;
        proxy_send_timeout 3h;
        proxy_buffering    off;
    }

    # Server API LiveKit (/twirp) sengaja TIDAK diekspos: backend memanggilnya
    # lewat network compose (http://livekit:7880).

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
