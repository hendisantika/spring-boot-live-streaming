# =============================================================================
# streaming.jvm.my.id
#   /api/*  -> Spring Boot (token server & pengatur peran)   127.0.0.1:8080
#   /rtc*   -> LiveKit signaling (WebSocket + /rtc/validate) 127.0.0.1:7880
#
# Media WebRTC TIDAK lewat nginx: client langsung ke IP server lewat
# 7881/tcp dan 7882/udp (atau rentang UDP yang diset di livekit.yaml).
#
# Pasang:
#   sudo cp nginx/streaming.jvm.my.id.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/streaming.jvm.my.id.conf /etc/nginx/sites-enabled/
#   sudo certbot certonly --webroot -w /var/www/certbot -d streaming.jvm.my.id
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

upstream live_streaming_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

upstream livekit_server {
    server 127.0.0.1:7880;
}

# Header Connection yang benar untuk WebSocket
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP -> HTTPS (kecuali challenge Let's Encrypt)
server {
    listen 80;
    listen [::]:80;
    server_name streaming.jvm.my.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name streaming.jvm.my.id;

    ssl_certificate     /etc/letsencrypt/live/streaming.jvm.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/streaming.jvm.my.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/streaming.jvm.my.id.access.log;
    error_log  /var/log/nginx/streaming.jvm.my.id.error.log;

    # Body API hanya JSON kecil (request token)
    client_max_body_size 64k;

    # --- Spring Boot API ---------------------------------------------------
    # CORS ditangani Spring Boot (LIVEKIT_ALLOWED_ORIGINS), jangan ditambah di sini.
    location /api/ {
        proxy_pass http://live_streaming_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # --- LiveKit signaling -------------------------------------------------
    # Client LiveKit memanggil wss://streaming.jvm.my.id/rtc dan /rtc/validate
    location /rtc {
        proxy_pass http://livekit_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Koneksi signaling hidup selama kelas berlangsung
        proxy_read_timeout  3h;
        proxy_send_timeout  3h;
        proxy_buffering     off;
    }

    # Server API LiveKit (/twirp) sengaja TIDAK diekspos: backend memanggilnya
    # langsung lewat http://127.0.0.1:7880 (LIVEKIT_API_URL).

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
